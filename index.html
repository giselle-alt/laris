<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cardio Challenge Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C1A17;
    --ink-2:#242119;
    --card:#28241D;
    --card-2:#312C22;
    --chalk:#F4EFE4;
    --chalk-dim:#B9B2A3;
    --muted:#948C7B;
    --orange:#FF5A1F;
    --orange-dim:#8A3311;
    --green:#8FBF3F;
    --line:#3A342A;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--chalk);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    font-size:16px;
    line-height:1.45;
    min-height:100vh;
    padding-bottom:48px;
  }
  .display{
    font-family:'Bebas Neue', 'Arial Narrow', sans-serif;
    letter-spacing:0.02em;
    font-weight:400;
  }
  .nums{ font-variant-numeric: tabular-nums; }

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:50;
    background:var(--ink);
    border-bottom:1px solid var(--line);
    padding:14px 16px 12px;
  }
  .topbar-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .brand{
    display:flex; align-items:baseline; gap:8px;
  }
  .brand .mark{
    width:10px; height:10px; border-radius:2px; background:var(--orange);
    display:inline-block; transform:rotate(45deg);
  }
  .brand-text{
    font-family:'Bebas Neue', sans-serif;
    font-size:22px;
    letter-spacing:0.03em;
  }
  .lang-switch{
    display:flex; background:var(--card); border:1px solid var(--line);
    border-radius:999px; padding:3px; gap:2px; flex-shrink:0;
  }
  .lang-switch button{
    border:none; background:transparent; color:var(--muted);
    font-family:'IBM Plex Sans', sans-serif; font-weight:600; font-size:13px;
    padding:6px 13px; border-radius:999px; cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .lang-switch button.active{
    background:var(--orange); color:#1C1A17;
  }
  .history-btn{
    background:var(--card); border:1px solid var(--line); color:var(--chalk);
    width:38px; height:38px; border-radius:999px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .history-btn svg{width:18px;height:18px;}

  .month-tabs{
    display:flex; gap:6px; margin-top:12px; overflow-x:auto;
    scrollbar-width:none;
  }
  .month-tabs::-webkit-scrollbar{display:none;}
  .month-tab{
    flex:1; text-align:center; padding:9px 6px;
    background:transparent; border:1px solid var(--line); color:var(--muted);
    border-radius:10px; font-family:'IBM Plex Sans'; font-weight:600; font-size:13px;
    cursor:pointer; white-space:nowrap;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .month-tab.active{
    border-color:var(--orange); color:var(--chalk); background:rgba(255,90,31,0.12);
  }

  /* ---------- Main ---------- */
  main{ padding:20px 16px 8px; max-width:520px; margin:0 auto; }

  .hero{
    margin-bottom:18px;
  }
  .hero .eyebrow{
    color:var(--orange); font-size:13px; font-weight:600; margin-bottom:2px;
  }
  .hero h1{
    font-family:'Bebas Neue', sans-serif;
    font-size:40px; line-height:0.95; margin:0 0 6px;
    letter-spacing:0.01em;
  }
  .hero .sub{ color:var(--chalk-dim); font-size:14.5px; max-width:38ch; }

  .progress-row{
    display:flex; align-items:center; gap:12px; margin-top:16px;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px;
  }
  .progress-count{
    font-family:'Bebas Neue'; font-size:30px; color:var(--orange); line-height:1;
    min-width:52px;
  }
  .progress-label{ font-size:12.5px; color:var(--muted); line-height:1.3; }
  .mark-today{
    margin-left:auto; background:var(--orange); color:#1C1A17; border:none;
    font-weight:700; font-size:13.5px; padding:10px 14px; border-radius:9px;
    cursor:pointer; white-space:nowrap;
  }
  .mark-today.done{
    background:var(--green); 
  }
  .mark-today:disabled{ opacity:.75; cursor:default; }

  /* ---------- Weekly structure strip ---------- */
  .flow{
    display:flex; align-items:center; gap:6px; margin:18px 0 20px;
    flex-wrap:wrap; font-size:12.5px; color:var(--chalk-dim);
  }
  .flow .step{
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:6px 11px; white-space:nowrap;
  }
  .flow .arrow{ color:var(--muted); }

  /* ---------- Circuit card ---------- */
  .circuit{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    margin-bottom:14px; overflow:hidden;
  }
  .circuit-head{
    display:flex; align-items:center; gap:12px;
    padding:14px 16px; border-bottom:1px solid var(--line);
  }
  .circuit-badge{
    width:34px; height:34px; border-radius:9px; background:var(--orange-dim);
    color:var(--orange); font-family:'Bebas Neue'; font-size:18px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .circuit-title{ flex:1; min-width:0; }
  .circuit-title .name{ font-weight:700; font-size:15.5px; }
  .circuit-title .meta{ font-size:12px; color:var(--muted); }
  .timer-readout{
    font-family:'Bebas Neue'; font-size:24px; color:var(--chalk);
  }

  .timer-controls{
    display:flex; gap:8px; padding:10px 16px; border-bottom:1px solid var(--line);
    background:var(--card-2);
  }
  .timer-controls button{
    flex:1; border:1px solid var(--line); background:transparent; color:var(--chalk);
    font-weight:600; font-size:13px; padding:8px 0; border-radius:8px; cursor:pointer;
  }
  .timer-controls button.primary{
    background:var(--orange); border-color:var(--orange); color:#1C1A17;
  }
  .timer-controls button.primary.running{
    background:transparent; color:var(--orange);
  }

  .exercise{
    display:flex; gap:12px; align-items:center;
    padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .exercise:last-child{ border-bottom:none; }
  .exercise .thumb{
    width:48px; height:48px; border-radius:9px; object-fit:cover; flex-shrink:0;
    background:var(--card-2);
  }
  .exercise .thumb.placeholder{
    display:flex; align-items:center; justify-content:center; color:var(--muted);
  }
  .exercise .info{ flex:1; min-width:0; }
  .exercise .ex-name{ font-weight:600; font-size:14.5px; }
  .exercise .ex-detail{ font-size:13px; color:var(--muted); }
  .checkbox{
    width:24px; height:24px; border-radius:7px; border:2px solid var(--line);
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
    color:transparent;
  }
  .checkbox.checked{
    background:var(--green); border-color:var(--green); color:#1C1A17;
  }
  .exercise.expanded-open .expand-img{
    display:block;
  }
  .expand-img{
    display:none; width:100%; border-radius:10px; margin-top:10px; max-height:280px; object-fit:cover;
  }
  .exercise-wrap{ display:flex; flex-direction:column; padding:0; border-bottom:1px solid var(--line);}
  .exercise-wrap:last-child{ border-bottom:none; }
  .exercise-wrap .exercise{ border-bottom:none; padding:12px 16px; }
  .exercise-wrap .expand-area{ padding:0 16px 14px; }

  .rest-block{
    display:flex; align-items:center; gap:12px; padding:12px 16px;
    background:var(--card); border:1px dashed var(--line); border-radius:var(--radius);
    margin-bottom:14px;
  }
  .rest-block .lbl{ flex:1; }
  .rest-block .lbl .name{ font-weight:600; font-size:14px; color:var(--chalk-dim); }
  .rest-block .lbl .meta{ font-size:12px; color:var(--muted); }
  .rest-timer{ font-family:'Bebas Neue'; font-size:22px; }
  .rest-btn{
    border:1px solid var(--line); background:transparent; color:var(--chalk);
    font-size:12.5px; font-weight:600; padding:7px 11px; border-radius:8px; cursor:pointer;
  }
  .rest-btn.running{ color:var(--orange); border-color:var(--orange); }

  .walk-card{
    display:flex; gap:12px; align-items:center;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; margin-top:4px;
  }
  .walk-icon{
    width:38px; height:38px; border-radius:9px; background:var(--orange-dim); color:var(--orange);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .walk-card .name{ font-weight:700; font-size:14.5px; }
  .walk-card .meta{ font-size:13px; color:var(--chalk-dim); }

  /* ---------- Empty template state ---------- */
  .empty-note{
    display:flex; gap:10px; align-items:flex-start;
    background:var(--card); border:1px dashed var(--line); border-radius:var(--radius);
    padding:14px; margin-bottom:16px; color:var(--chalk-dim); font-size:13.5px;
  }
  .empty-note svg{ flex-shrink:0; margin-top:2px; color:var(--orange); width:18px; height:18px;}
  .add-exercise-btn{
    width:100%; padding:12px; margin:2px 0 0;
    border:1px dashed var(--line); background:transparent; color:var(--muted);
    border-radius:10px; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .placeholder-icon{
    font-family:'Bebas Neue'; font-size:16px;
  }
  .remove-x{
    width:22px; height:22px; border-radius:999px; border:1px solid var(--line);
    background:transparent; color:var(--muted); font-size:13px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }

  /* ---------- History drawer ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:100;
    display:none; align-items:flex-end; justify-content:center;
  }
  .overlay.open{ display:flex; }
  .drawer{
    background:var(--ink-2); width:100%; max-width:560px; border-radius:18px 18px 0 0;
    padding:18px 18px 26px; max-height:82vh; overflow-y:auto;
    border-top:1px solid var(--line);
  }
  .drawer-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .drawer-head h2{ font-family:'Bebas Neue'; font-size:26px; margin:0; }
  .drawer-close{
    width:32px; height:32px; border-radius:999px; border:1px solid var(--line); background:transparent;
    color:var(--chalk); cursor:pointer; font-size:16px;
  }
  .streak-row{ display:flex; gap:10px; margin-bottom:16px; }
  .streak-card{
    flex:1; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px;
    text-align:center;
  }
  .streak-card .n{ font-family:'Bebas Neue'; font-size:28px; color:var(--orange); }
  .streak-card .l{ font-size:11.5px; color:var(--muted); }
  .cal-month{ margin-bottom:18px; }
  .cal-month h3{ font-size:14px; font-weight:700; margin:0 0 8px; color:var(--chalk-dim); }
  .cal-grid{
    display:grid; grid-template-columns:repeat(7,1fr); gap:5px;
  }
  .cal-day{
    aspect-ratio:1; border-radius:7px; background:var(--card);
    display:flex; align-items:center; justify-content:center;
    font-size:11.5px; color:var(--muted); border:1px solid var(--line);
  }
  .cal-day.done{ background:var(--green); color:#1C1A17; border-color:var(--green); font-weight:700; }
  .cal-day.empty{ background:transparent; border-color:transparent; }

  /* ---------- Add-exercise modal ---------- */
  .modal-card{
    background:var(--ink-2); border-radius:16px; padding:18px; width:100%; max-width:400px;
    border:1px solid var(--line);
  }
  .modal-card h3{ font-family:'Bebas Neue'; font-size:22px; margin:0 0 12px; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:5px; }
  .field input{
    width:100%; background:var(--card); border:1px solid var(--line); color:var(--chalk);
    padding:10px 11px; border-radius:9px; font-size:14.5px; font-family:'IBM Plex Sans';
  }
  .modal-actions{ display:flex; gap:8px; margin-top:14px; }
  .modal-actions button{
    flex:1; padding:11px; border-radius:9px; font-weight:700; font-size:13.5px; cursor:pointer; border:none;
  }
  .modal-actions .cancel{ background:transparent; border:1px solid var(--line); color:var(--chalk); }
  .modal-actions .save{ background:var(--orange); color:#1C1A17; }

  footer{ text-align:center; color:var(--muted); font-size:12px; padding:20px 16px 4px; }

  /* ---------- Focus mode (full-screen circuit runner) ---------- */
  .focus-overlay{ align-items:stretch; justify-content:stretch; }
  .focus-overlay.open{ display:flex; }
  .focus-content{
    background:var(--ink); width:100%; min-height:100vh; overflow-y:auto;
    padding:18px 20px 34px; display:flex; flex-direction:column;
  }
  .focus-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .focus-title{ font-family:'Bebas Neue'; font-size:24px; }
  .focus-timer{
    font-family:'Bebas Neue'; font-size:104px; text-align:center; line-height:1;
    margin:22px 0 4px; color:var(--chalk); transition:color .2s ease;
  }
  .focus-timer.done{ color:var(--orange); }
  .focus-timeup{ text-align:center; color:var(--orange); font-weight:700; font-size:13.5px; height:18px; margin-bottom:14px; }
  .focus-timer-controls{ display:flex; gap:10px; justify-content:center; margin-bottom:26px; }
  .focus-timer-controls button{
    border:1px solid var(--line); background:transparent; color:var(--chalk);
    padding:11px 24px; border-radius:10px; font-weight:700; font-size:14px; cursor:pointer;
  }
  .focus-timer-controls button.primary{ background:var(--orange); border-color:var(--orange); color:#1C1A17; }
  .focus-timer-controls button.primary.running{ background:transparent; color:var(--orange); }
  .focus-rounds{
    text-align:center; background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:22px 18px; margin-bottom:22px;
  }
  .focus-rounds-label{ font-size:12.5px; color:var(--muted); margin-bottom:8px; }
  .focus-rounds-count{ font-family:'Bebas Neue'; font-size:72px; color:var(--orange); line-height:1; margin-bottom:16px; }
  .focus-round-buttons{ display:flex; gap:10px; justify-content:center; align-items:center; }
  .round-minus{
    width:54px; height:54px; border-radius:999px; border:1px solid var(--line); background:transparent;
    color:var(--chalk); font-size:20px; font-weight:700; cursor:pointer; flex-shrink:0;
  }
  .round-plus{
    flex:1; max-width:240px; height:54px; border-radius:999px; border:none; background:var(--green);
    color:#1C1A17; font-size:16px; font-weight:800; cursor:pointer;
  }
  .focus-exercise-list{ margin-top:auto; padding-top:10px; }
  .focus-ex-row{ display:flex; gap:10px; align-items:center; padding:9px 0; border-top:1px solid var(--line); }
  .focus-ex-row img{ width:38px; height:38px; border-radius:9px; object-fit:cover; flex-shrink:0; }
  .focus-ex-row .n{ font-weight:600; font-size:13.5px; }
  .focus-ex-row .d{ font-size:12px; color:var(--muted); }

  .start-circuit-btn{
    width:100%; padding:11px; border:none; border-radius:9px; font-weight:700; font-size:14px;
    background:var(--orange); color:#1C1A17; cursor:pointer;
  }
  .start-circuit-btn.running{ background:transparent; border:1px solid var(--orange); color:var(--orange); }
  .rounds-today{ font-size:11.5px; color:var(--muted); text-align:right; margin-top:2px; }

  @media (max-width:360px){
    .hero h1{ font-size:34px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <span class="mark"></span>
      <span class="brand-text" data-t="appName">CARDIO CHALLENGE</span>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <button class="history-btn" id="historyBtn" title="History">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
      </button>
      <div class="lang-switch">
        <button id="btn-en">EN</button>
        <button id="btn-es">ES</button>
      </div>
    </div>
  </div>
  <div class="month-tabs" id="monthTabs"></div>
</div>

<main>
  <div class="hero">
    <div class="eyebrow" data-t="monthlyChallenge"></div>
    <h1 id="monthTitle" class="display"></h1>
    <div class="sub" id="monthSub"></div>
  </div>

  <div class="progress-row">
    <div class="progress-count nums" id="progressCount">0</div>
    <div class="progress-label" id="progressLabel"></div>
    <button class="mark-today" id="markTodayBtn"></button>
  </div>

  <div class="flow" id="flowRow"></div>

  <div id="circuitsWrap"></div>

  <div class="walk-card" id="walkCard">
    <div class="walk-icon">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13" cy="4" r="2"/><path d="M13 22l1-7-3-2 1-5-4 1M8 10l-3 1 1 5 3-2"/></svg>
    </div>
    <div>
      <div class="name" data-t="walkTitle"></div>
      <div class="meta" data-t="walkDetail"></div>
    </div>
  </div>
</main>

<footer id="footerNote"></footer>

<!-- History drawer -->
<div class="overlay" id="historyOverlay">
  <div class="drawer">
    <div class="drawer-head">
      <h2 data-t="historyTitle"></h2>
      <button class="drawer-close" id="closeHistory">✕</button>
    </div>
    <div class="streak-row">
      <div class="streak-card"><div class="n" id="totalDoneStat">0</div><div class="l" data-t="totalDays"></div></div>
      <div class="streak-card"><div class="n" id="streakStat">0</div><div class="l" data-t="streak"></div></div>
    </div>
    <div id="calendarWrap"></div>
  </div>
</div>

<!-- Add exercise modal -->
<div class="overlay" id="addOverlay">
  <div class="modal-card">
    <h3 data-t="addExercise"></h3>
    <div class="field"><label data-t="exerciseNameEn"></label><input id="inpNameEn" type="text"></div>
    <div class="field"><label data-t="exerciseNameEs"></label><input id="inpNameEs" type="text"></div>
    <div class="field"><label data-t="exerciseDetailEn"></label><input id="inpDetailEn" type="text" placeholder="e.g. 15 reps"></div>
    <div class="field"><label data-t="exerciseDetailEs"></label><input id="inpDetailEs" type="text" placeholder="ej. 15 repeticiones"></div>
    <div class="modal-actions">
      <button class="cancel" id="cancelAdd" data-t="cancel"></button>
      <button class="save" id="saveAdd" data-t="save"></button>
    </div>
  </div>
</div>

<div class="overlay focus-overlay" id="focusOverlay">
  <div class="focus-content">
    <div class="focus-top">
      <div class="focus-title" id="focusTitle"></div>
      <button class="drawer-close" id="focusClose">✕</button>
    </div>
    <div class="focus-timer nums" id="focusTimer">15:00</div>
    <div class="focus-timeup" id="focusTimeUp"></div>
    <div class="focus-timer-controls">
      <button id="focusToggleBtn" class="primary"></button>
      <button id="focusResetBtn"></button>
    </div>
    <div class="focus-rounds">
      <div class="focus-rounds-label" id="focusRoundsLabel"></div>
      <div class="focus-rounds-count nums" id="focusRoundsCount">0</div>
      <div class="focus-round-buttons">
        <button class="round-minus" id="focusMinusBtn">−1</button>
        <button class="round-plus" id="focusPlusBtn"></button>
      </div>
    </div>
    <div class="focus-exercise-list" id="focusExerciseList"></div>
  </div>

/* ============ State ============ */
let lang = "es";
let currentMonth = "september";
let customMonths = { october:{circuitA:[], circuitB:[]}, november:{circuitA:[], circuitB:[]}, december:{circuitA:[], circuitB:[]} };
let progress = {}; // {"2026-09-10": true}
let timers = {}; // per circuit id: {seconds, running, intervalId, total}
let addTarget = null; // {month, circuit}
let roundsLog = {}; // {"2026-09-10-september-A": 4}
let focusCircuitId = null; // which circuit is currently open in focus mode

const STORAGE_PROGRESS_KEY = "cardio-progress-log";
const STORAGE_CUSTOM_KEY = "cardio-custom-months";
const STORAGE_ROUNDS_KEY = "cardio-rounds-log";

/* ============ Storage ============ */
async function loadState(){
  try{
    const p = await window.storage.get(STORAGE_PROGRESS_KEY);
    if(p && p.value) progress = JSON.parse(p.value);
  }catch(e){ progress = {}; }
  try{
    const c = await window.storage.get(STORAGE_CUSTOM_KEY);
    if(c && c.value) customMonths = JSON.parse(c.value);
  }catch(e){ /* keep defaults */ }
  try{
    const r = await window.storage.get(STORAGE_ROUNDS_KEY);
    if(r && r.value) roundsLog = JSON.parse(r.value);
  }catch(e){ roundsLog = {}; }
  render();
}
async function saveProgress(){
  try{ await window.storage.set(STORAGE_PROGRESS_KEY, JSON.stringify(progress)); }catch(e){}
}
async function saveCustomMonths(){
  try{ await window.storage.set(STORAGE_CUSTOM_KEY, JSON.stringify(customMonths)); }catch(e){}
}
async function saveRoundsLog(){
  try{ await window.storage.set(STORAGE_ROUNDS_KEY, JSON.stringify(roundsLog)); }catch(e){}
}
function roundsKey(circuitId){ return todayKey()+"-"+circuitId; }
function getRoundsToday(circuitId){ return roundsLog[roundsKey(circuitId)] || 0; }

/* ============ Helpers ============ */
function todayKey(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function t(key){ return UI[lang][key]; }
function daysInMonth(monthKey){
  const idx = MONTH_INDEX[monthKey];
  return new Date(2026, idx+1, 0).getDate();
}
function countDoneInMonth(monthKey){
  const idx = MONTH_INDEX[monthKey];
  const prefix = "2026-"+String(idx+1).padStart(2,"0")+"-";
  return Object.keys(progress).filter(k=>k.startsWith(prefix) && progress[k]).length;
}
function getMonthData(monthKey){
  if(monthKey === "september") return SEPTEMBER_DATA;
  return customMonths[monthKey] || {circuitA:[], circuitB:[]};
}
function isCurrentMonthToday(monthKey){
  const d = new Date();
  return MONTH_INDEX[monthKey] === d.getMonth() && d.getFullYear() === 2026;
}

/* ============ Rendering ============ */
function render(){
  document.documentElement.lang = lang;
  document.getElementById("btn-en").classList.toggle("active", lang==="en");
  document.getElementById("btn-es").classList.toggle("active", lang==="es");
  document.querySelectorAll("[data-t]").forEach(el=>{
    const key = el.getAttribute("data-t");
    if(typeof UI[lang][key] === "string") el.textContent = UI[lang][key];
  });

  renderMonthTabs();
  renderHero();
  renderProgress();
  renderFlow();
  renderCircuits();
  document.getElementById("footerNote").textContent = t("footer");
}

function renderMonthTabs(){
  const wrap = document.getElementById("monthTabs");
  wrap.innerHTML = "";
  MONTH_ORDER.forEach(m=>{
    const b = document.createElement("button");
    b.className = "month-tab" + (m===currentMonth ? " active":"");
    b.textContent = UI[lang].months[m];
    b.onclick = ()=>{ currentMonth = m; stopAllTimers(); render(); };
    wrap.appendChild(b);
  });
}

function renderHero(){
  document.getElementById("monthTitle").textContent = UI[lang].months[currentMonth] + " " + (lang==="es" ? "Reto":"Challenge");
  document.getElementById("monthSub").textContent = t("dailyStructure");
}

function renderProgress(){
  const done = countDoneInMonth(currentMonth);
  document.getElementById("progressCount").textContent = done;
  document.getElementById("progressLabel").textContent = t("progressLabelFn")(done, daysInMonth(currentMonth));
  const btn = document.getElementById("markTodayBtn");
  const key = todayKey();
  const isToday = isCurrentMonthToday(currentMonth);
  const doneToday = !!progress[key];
  btn.textContent = doneToday ? t("markedToday") : t("markToday");
  btn.classList.toggle("done", doneToday);
  btn.style.display = isToday ? "block" : "none";
  btn.onclick = async ()=>{
    progress[key] = !progress[key];
    await saveProgress();
    renderProgress();
  };
}

function renderFlow(){
  const wrap = document.getElementById("flowRow");
  const labelA = `${t("circuit")} A (15 min)`;
  const labelR = `${t("rest")} 2–3 min`;
  const labelB = `${t("circuit")} B (15 min)`;
  wrap.innerHTML = `
    <span class="step">${labelA}</span>
    <span class="arrow">${t("flowArrow")}</span>
    <span class="step">${labelR}</span>
    <span class="arrow">${t("flowArrow")}</span>
    <span class="step">${labelB}</span>
  `;
}

function renderCircuits(){
  const wrap = document.getElementById("circuitsWrap");
  wrap.innerHTML = "";
  const data = getMonthData(currentMonth);
  const isEmpty = currentMonth !== "september" && data.circuitA.length===0 && data.circuitB.length===0;

  if(isEmpty){
    const note = document.createElement("div");
    note.className = "empty-note";
    note.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><div>${t("emptyTemplate")}</div>`;
    wrap.appendChild(note);
  }

  wrap.appendChild(buildCircuitCard("A", data.circuitA));
  wrap.appendChild(buildRestBlock());
  wrap.appendChild(buildCircuitCard("B", data.circuitB));
}

function buildCircuitCard(letter, exercises){
  const circuitId = currentMonth+"-"+letter;
  if(!timers[circuitId]) timers[circuitId] = { seconds: 15*60, running:false, total:15*60, intervalId:null };

  const card = document.createElement("div");
  card.className = "circuit";

  const head = document.createElement("div");
  head.className = "circuit-head";
  head.innerHTML = `
    <div class="circuit-badge">${letter}</div>
    <div class="circuit-title">
      <div class="name">${t("circuit")} ${letter}</div>
      <div class="meta">${exercises.length} ${lang==="es" ? "ejercicios":"exercises"}</div>
    </div>
    <div class="timer-readout nums" id="readout-${circuitId}">${formatTime(timers[circuitId].seconds)}</div>
  `;
  card.appendChild(head);

  const controls = document.createElement("div");
  controls.className = "timer-controls";
  const startBtn = document.createElement("button");
  startBtn.className = "start-circuit-btn" + (timers[circuitId].running ? " running":"");
  startBtn.id = "startbtn-"+circuitId;
  const hasProgress = timers[circuitId].seconds < timers[circuitId].total;
  startBtn.textContent = timers[circuitId].running || hasProgress ? t("resumeCircuit") : t("startCircuit");
  startBtn.style.flex = "1";
  startBtn.onclick = ()=> openFocus(circuitId, letter, exercises);
  controls.appendChild(startBtn);
  card.appendChild(controls);

  const roundsToday = document.createElement("div");
  roundsToday.className = "rounds-today";
  roundsToday.id = "rounds-today-"+circuitId;
  roundsToday.textContent = t("roundsToday")(getRoundsToday(circuitId));
  roundsToday.style.padding = "0 16px 10px";
  card.appendChild(roundsToday);

  exercises.forEach((ex,i)=>{
    card.appendChild(buildExerciseRow(circuitId, i, ex));
  });

  if(currentMonth !== "september"){
    const addBtn = document.createElement("button");
    addBtn.className = "add-exercise-btn";
    addBtn.textContent = "+ " + t("addExercise");
    addBtn.onclick = ()=> openAddModal(currentMonth, letter==="A"?"circuitA":"circuitB");
    card.appendChild(addBtn);
  }

  return card;
}

function buildExerciseRow(circuitId, idx, ex){
  const rowWrap = document.createElement("div");
  rowWrap.className = "exercise-wrap";
  const exId = circuitId+"-ex-"+idx;
  const checked = !!progress[exId+"-"+todayKey()];

  const row = document.createElement("div");
  row.className = "exercise";

  let thumbHtml;
  if(ex.img && EXERCISE_IMAGES[ex.img]){
    thumbHtml = `<img class="thumb" src="${EXERCISE_IMAGES[ex.img]}" alt="">`;
  }else{
    thumbHtml = `<div class="thumb placeholder"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7v10M18 7v10M2 12h4M18 12h4M6 12h12"/></svg></div>`;
  }

  const name = lang==="es" ? ex.nameEs : ex.nameEn;
  const detail = lang==="es" ? ex.detailEs : ex.detailEn;

  row.innerHTML = `
    ${thumbHtml}
    <div class="info">
      <div class="ex-name">${name || ""}</div>
      <div class="ex-detail">${detail || ""}</div>
    </div>
    <div class="checkbox ${checked?'checked':''}" id="chk-${exId}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
  `;

  row.onclick = (e)=>{
    if(e.target.closest(".checkbox")){
      const key = exId+"-"+todayKey();
      progress[key] = !progress[key];
      saveProgress();
      document.getElementById("chk-"+exId).classList.toggle("checked");
      return;
    }
    row.classList.toggle("expanded-open");
    const area = rowWrap.querySelector(".expand-area");
    area.style.display = area.style.display === "block" ? "none" : "block";
  };

  rowWrap.appendChild(row);

  const expandArea = document.createElement("div");
  expandArea.className = "expand-area";
  expandArea.style.display = "none";
  if(ex.img && EXERCISE_IMAGES[ex.img]){
    expandArea.innerHTML = `<img class="expand-img" style="display:block;" src="${EXERCISE_IMAGES[ex.img]}" alt="">`;
  }
  rowWrap.appendChild(expandArea);

  return rowWrap;
}

function buildRestBlock(){
  const restId = currentMonth+"-REST";
  if(!timers[restId]) timers[restId] = { seconds: 150, running:false, total:150, intervalId:null };

  const block = document.createElement("div");
  block.className = "rest-block";
  block.innerHTML = `
    <div class="lbl">
      <div class="name">${t("rest")}</div>
      <div class="meta">2–3 min</div>
    </div>
    <div class="rest-timer nums" id="readout-${restId}">${formatTime(timers[restId].seconds)}</div>
    <button class="rest-btn ${timers[restId].running?'running':''}" id="startbtn-${restId}">${timers[restId].running ? t("pause") : t("start")}</button>
  `;
  block.querySelector("#startbtn-"+restId).onclick = ()=> toggleTimer(restId, 150);
  return block;
}

/* ============ Timers ============ */
function formatTime(sec){
  sec = Math.max(0, sec);
  const m = Math.floor(sec/60);
  const s = sec % 60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function toggleTimer(id, totalDefault){
  const timer = timers[id];
  if(timer.running){
    clearInterval(timer.intervalId);
    timer.running = false;
  } else {
    timer.running = true;
    timer.intervalId = setInterval(()=>{
      timer.seconds -= 1;
      const readout = document.getElementById("readout-"+id);
      if(readout) readout.textContent = formatTime(timer.seconds);
      if(focusCircuitId === id){
        const fReadout = document.getElementById("focusTimer");
        if(fReadout) fReadout.textContent = formatTime(timer.seconds);
      }
      if(timer.seconds <= 0){
        clearInterval(timer.intervalId);
        timer.running = false;
        timer.seconds = 0;
        updateTimerButtons(id);
        if(navigator.vibrate) navigator.vibrate([200,100,200]);
        if(focusCircuitId === id){
          const fReadout = document.getElementById("focusTimer");
          const timeUpEl = document.getElementById("focusTimeUp");
          if(fReadout) fReadout.classList.add("done");
          if(timeUpEl) timeUpEl.textContent = t("timeUp");
        }
      }
    }, 1000);
  }
  updateTimerButtons(id);
}
function resetTimer(id, totalDefault){
  const timer = timers[id];
  clearInterval(timer.intervalId);
  timer.running = false;
  timer.seconds = totalDefault;
  const readout = document.getElementById("readout-"+id);
  if(readout) readout.textContent = formatTime(timer.seconds);
  if(focusCircuitId === id){
    const fReadout = document.getElementById("focusTimer");
    const timeUpEl = document.getElementById("focusTimeUp");
    if(fReadout){ fReadout.textContent = formatTime(timer.seconds); fReadout.classList.remove("done"); }
    if(timeUpEl) timeUpEl.textContent = "";
  }
  updateTimerButtons(id);
}
function updateTimerButtons(id){
  const btn = document.getElementById("startbtn-"+id);
  if(btn){
    const hasProgress = timers[id].seconds < timers[id].total;
    if(btn.classList.contains("start-circuit-btn")){
      btn.textContent = timers[id].running || hasProgress ? t("resumeCircuit") : t("startCircuit");
    } else {
      btn.textContent = timers[id].running ? t("pause") : t("start");
    }
    btn.classList.toggle("running", timers[id].running);
  }
  if(focusCircuitId === id){
    const fbtn = document.getElementById("focusToggleBtn");
    if(fbtn){
      fbtn.textContent = timers[id].running ? t("pause") : t("start");
      fbtn.classList.toggle("running", timers[id].running);
    }
  }
}
function stopAllTimers(){
  Object.keys(timers).forEach(id=>{
    if(timers[id].running){ clearInterval(timers[id].intervalId); timers[id].running=false; }
  });
}

/* ============ Focus mode (full-screen circuit runner) ============ */
function openFocus(circuitId, letter, exercises){
  focusCircuitId = circuitId;
  document.getElementById("focusTitle").textContent = `${t("circuit")} ${letter}`;
  document.getElementById("focusTimer").textContent = formatTime(timers[circuitId].seconds);
  document.getElementById("focusTimer").classList.toggle("done", timers[circuitId].seconds<=0);
  document.getElementById("focusTimeUp").textContent = timers[circuitId].seconds<=0 ? t("timeUp") : "";
  document.getElementById("focusRoundsLabel").textContent = t("roundsLabel");
  document.getElementById("focusRoundsCount").textContent = getRoundsToday(circuitId);
  document.getElementById("focusPlusBtn").textContent = t("plus1Round");
  document.getElementById("focusResetBtn").textContent = t("reset");
  updateTimerButtons(circuitId);

  const listWrap = document.getElementById("focusExerciseList");
  listWrap.innerHTML = "";
  exercises.forEach(ex=>{
    const row = document.createElement("div");
    row.className = "focus-ex-row";
    const imgHtml = (ex.img && EXERCISE_IMAGES[ex.img]) ? `<img src="${EXERCISE_IMAGES[ex.img]}" alt="">` : "";
    const name = lang==="es" ? ex.nameEs : ex.nameEn;
    const detail = lang==="es" ? ex.detailEs : ex.detailEn;
    row.innerHTML = `${imgHtml}<div><div class="n">${name||""}</div><div class="d">${detail||""}</div></div>`;
    listWrap.appendChild(row);
  });

  document.getElementById("focusOverlay").classList.add("open");
  if(!timers[circuitId].running && timers[circuitId].seconds > 0){
    toggleTimer(circuitId, timers[circuitId].total);
  }
}
function closeFocus(){
  document.getElementById("focusOverlay").classList.remove("open");
  focusCircuitId = null;
  renderCircuits();
}
function changeRounds(delta){
  if(!focusCircuitId) return;
  const key = roundsKey(focusCircuitId);
  const next = Math.max(0, (roundsLog[key]||0) + delta);
  roundsLog[key] = next;
  document.getElementById("focusRoundsCount").textContent = next;
  saveRoundsLog();
}
document.getElementById("focusClose").onclick = closeFocus;
document.getElementById("focusOverlay").onclick = (e)=>{ if(e.target.id==="focusOverlay") closeFocus(); };
document.getElementById("focusToggleBtn").onclick = ()=>{ if(focusCircuitId) toggleTimer(focusCircuitId, timers[focusCircuitId].total); };
document.getElementById("focusResetBtn").onclick = ()=>{ if(focusCircuitId) resetTimer(focusCircuitId, timers[focusCircuitId].total); };
document.getElementById("focusPlusBtn").onclick = ()=> changeRounds(1);
document.getElementById("focusMinusBtn").onclick = ()=> changeRounds(-1);

/* ============ Add exercise modal ============ */
function openAddModal(month, circuitKey){
  addTarget = {month, circuitKey};
  document.getElementById("inpNameEn").value = "";
  document.getElementById("inpNameEs").value = "";
  document.getElementById("inpDetailEn").value = "";
  document.getElementById("inpDetailEs").value = "";
  document.getElementById("addOverlay").classList.add("open");
}
document.getElementById("cancelAdd").onclick = ()=> document.getElementById("addOverlay").classList.remove("open");
document.getElementById("addOverlay").onclick = (e)=>{ if(e.target.id==="addOverlay") document.getElementById("addOverlay").classList.remove("open"); };
document.getElementById("saveAdd").onclick = async ()=>{
  const nameEn = document.getElementById("inpNameEn").value.trim();
  const nameEs = document.getElementById("inpNameEs").value.trim();
  const detailEn = document.getElementById("inpDetailEn").value.trim();
  const detailEs = document.getElementById("inpDetailEs").value.trim();
  if(!nameEn && !nameEs) { document.getElementById("addOverlay").classList.remove("open"); return; }
  const {month, circuitKey} = addTarget;
  if(!customMonths[month]) customMonths[month] = {circuitA:[], circuitB:[]};
  customMonths[month][circuitKey].push({
    img:null, nameEn: nameEn||nameEs, nameEs: nameEs||nameEn,
    detailEn: detailEn, detailEs: detailEs
  });
  await saveCustomMonths();
  document.getElementById("addOverlay").classList.remove("open");
  render();
};

/* ============ History drawer ============ */
document.getElementById("historyBtn").onclick = ()=>{
  renderHistory();
  document.getElementById("historyOverlay").classList.add("open");
};
document.getElementById("closeHistory").onclick = ()=> document.getElementById("historyOverlay").classList.remove("open");
document.getElementById("historyOverlay").onclick = (e)=>{ if(e.target.id==="historyOverlay") document.getElementById("historyOverlay").classList.remove("open"); };

function renderHistory(){
  const totalDone = Object.values(progress).filter(Boolean).length;
  document.getElementById("totalDoneStat").textContent = totalDone;
  document.getElementById("streakStat").textContent = computeStreak();

  const wrap = document.getElementById("calendarWrap");
  wrap.innerHTML = "";
  MONTH_ORDER.forEach(m=>{
    const section = document.createElement("div");
    section.className = "cal-month";
    const dim = daysInMonth(m);
    const idx = MONTH_INDEX[m];
    const firstDow = new Date(2026, idx, 1).getDay(); // 0=Sun
    let cells = "";
    for(let i=0;i<firstDow;i++) cells += `<div class="cal-day empty"></div>`;
    for(let d=1; d<=dim; d++){
      const key = "2026-"+String(idx+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
      const done = !!progress[key];
      cells += `<div class="cal-day ${done?'done':''}">${d}</div>`;
    }
    section.innerHTML = `<h3>${UI[lang].months[m]}</h3><div class="cal-grid">${cells}</div>`;
    wrap.appendChild(section);
  });
}
function computeStreak(){
  let streak = 0;
  let d = new Date();
  while(true){
    const key = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if(progress[key]){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}

/* ============ Lang switch ============ */
document.getElementById("btn-en").onclick = ()=>{ lang="en"; render(); };
document.getElementById("btn-es").onclick = ()=>{ lang="es"; render(); };

/* ============ Init ============ */
loadState();
</script>
